<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="42" font-size="26" font-weight="bold" fill="#111827" text-anchor="middle">图 1 · 全景：三个工程与它们的产物去向</text>
  <text x="600" y="70" font-size="15" fill="#6b7280" text-anchor="middle">同一个类要写两份（壳 / 真身），Unity 存"名字+字段值"，游戏按名字找回真身</text>

  <!-- lane 1 -->
  <rect x="40" y="110" width="300" height="130" rx="10" fill="#eef3fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="190" y="142" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">① MonoBehaviours 工程</text>
  <text x="190" y="168" font-size="14" fill="#374151" text-anchor="middle">只有字段、函数体全空的壳</text>
  <text x="190" y="190" font-size="14" fill="#374151" text-anchor="middle">只引用 UnityEngine</text>
  <text x="190" y="216" font-size="13" fill="#b45309" text-anchor="middle">AssemblyName = HKCustomSceneMod</text>

  <line x1="340" y1="175" x2="440" y2="175" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="390" y="163" font-size="13" fill="#4b5563" text-anchor="middle">编译</text>
  <text x="390" y="196" font-size="12" fill="#4b5563" text-anchor="middle">dotnet build</text>

  <rect x="450" y="110" width="300" height="130" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="142" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Unity 工程 / Assets/Assemblies/</text>
  <text x="600" y="168" font-size="14" fill="#374151" text-anchor="middle">壳 dll + SFCore.dll</text>
  <text x="600" y="194" font-size="14" fill="#9a3412" text-anchor="middle">只在 Unity 里用</text>
  <text x="600" y="218" font-size="13" fill="#6b7280" text-anchor="middle">让组件能挂上去、字段能存下来</text>

  <!-- lane 2 -->
  <rect x="40" y="300" width="300" height="130" rx="10" fill="#eef3fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="190" y="332" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">② UnityProject</text>
  <text x="190" y="358" font-size="14" fill="#374151" text-anchor="middle">房间场景 .unity</text>
  <text x="190" y="380" font-size="14" fill="#374151" text-anchor="middle">地形 mesh + 碰撞体 + 装饰 + 门</text>
  <text x="190" y="408" font-size="13" fill="#6b7280" text-anchor="middle">你在这里画关卡</text>

  <line x1="340" y1="365" x2="440" y2="365" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="390" y="353" font-size="13" fill="#4b5563" text-anchor="middle">打包</text>
  <text x="390" y="386" font-size="12" fill="#4b5563" text-anchor="middle">AssetBundle</text>

  <rect x="450" y="300" width="300" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="332" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">hkcs_scenes（资源包）</text>
  <text x="600" y="358" font-size="14" fill="#374151" text-anchor="middle">所有房间的施工图打成一包</text>
  <text x="600" y="384" font-size="14" fill="#166534" text-anchor="middle">多房间推荐"一个包放全部"</text>

  <line x1="750" y1="365" x2="850" y2="365" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="800" y="353" font-size="13" fill="#4b5563" text-anchor="middle">塞进去</text>
  <text x="800" y="386" font-size="12" fill="#4b5563" text-anchor="middle">EmbeddedResource</text>

  <rect x="860" y="300" width="300" height="130" rx="10" fill="#eef3fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="1010" y="332" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">③ FinalMod 工程</text>
  <text x="1010" y="358" font-size="14" fill="#374151" text-anchor="middle">真正的逻辑（引用 HK 程序集）</text>
  <text x="1010" y="384" font-size="14" fill="#374151" text-anchor="middle">Resources/ 放那个资源包</text>

  <!-- lane 3 -->
  <rect x="860" y="500" width="300" height="120" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="2.5"/>
  <text x="1010" y="532" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">HKCustomSceneMod.dll</text>
  <text x="1010" y="558" font-size="14" fill="#374151" text-anchor="middle">逻辑 + 内嵌资源包，就一个文件</text>
  <text x="1010" y="588" font-size="13" fill="#9a3412" text-anchor="middle">复制到 游戏 Managed/Mods/</text>

  <path d="M1010 430 L1010 495" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1040" y="466" font-size="13" fill="#4b5563">编译</text>

  <rect x="460" y="500" width="300" height="120" rx="10" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
  <text x="610" y="532" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">空洞骑士（游戏本体）</text>
  <text x="610" y="558" font-size="14" fill="#374151" text-anchor="middle">启动时读 Mods 里的 dll</text>
  <text x="610" y="588" font-size="14" fill="#374151" text-anchor="middle">把你的房间接到走廊上</text>

  <path d="M855 560 L770 560" stroke="#6b7280" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="812" y="548" font-size="13" fill="#4b5563" text-anchor="middle">加载</text>

  <rect x="40" y="500" width="380" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="530" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">最容易忘的一步</text>
  <text x="230" y="558" font-size="14" fill="#374151" text-anchor="middle">壳 dll 改了字段 → 必须重编并重开 Unity</text>
  <text x="230" y="584" font-size="14" fill="#374151" text-anchor="middle">否则 Unity 里字段是空的 / 组件变 Missing</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
