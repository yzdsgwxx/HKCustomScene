<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif">
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="600" y="42" font-size="26" font-weight="bold" fill="#111827" text-anchor="middle">图 4 · 同一个类为什么要写两份（最容易懵的地方）</text>
  <text x="600" y="70" font-size="15" fill="#6b7280" text-anchor="middle">Unity 保存的不是"实现"，是"名字 + 字段值"；游戏按名字找回真身</text>

  <!-- left: shell -->
  <rect x="40" y="110" width="420" height="330" rx="10" fill="#eef3fb" stroke="#4a6fa5" stroke-width="2.5"/>
  <text x="250" y="142" font-size="18" font-weight="bold" fill="#1e40af" text-anchor="middle">① MonoBehaviours 工程（壳）</text>
  <text x="250" y="170" font-size="13" fill="#6b7280" text-anchor="middle">只引用 UnityEngine，绝不引用游戏程序集</text>
  <rect x="62" y="188" width="376" height="150" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="78" y="212" font-size="13" fill="#6b7280" font-family="Consolas, monospace">namespace HKCustomSceneMod.Patchers</text>
  <text x="78" y="236" font-size="13" fill="#1f2937" font-family="Consolas, monospace">class PatchAreaTitleController</text>
  <text x="78" y="260" font-size="13" fill="#1f2937" font-family="Consolas, monospace">{</text>
  <text x="98" y="282" font-size="13" fill="#374151" font-family="Consolas, monospace">public float  Pause = 3f;</text>
  <text x="98" y="304" font-size="13" fill="#374151" font-family="Consolas, monospace">public string AreaEvent = "";</text>
  <text x="98" y="326" font-size="13" fill="#dc2626" font-family="Consolas, monospace">void Awake() { }  // 空的</text>
  <text x="78" y="348" font-size="13" fill="#1f2937" font-family="Consolas, monospace">}</text>
  <text x="250" y="368" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">编译成 HKCustomSceneMod.dll</text>
  <text x="250" y="396" font-size="14" fill="#374151" text-anchor="middle">丢进 Unity 的 Assets/Assemblies/</text>
  <text x="250" y="422" font-size="13" fill="#6b7280" text-anchor="middle">作用：让 Unity "看得见"这个类型</text>

  <!-- right: real -->
  <rect x="740" y="110" width="420" height="330" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="2.5"/>
  <text x="950" y="142" font-size="18" font-weight="bold" fill="#9a3412" text-anchor="middle">② FinalMod 工程（真身）</text>
  <text x="950" y="170" font-size="13" fill="#6b7280" text-anchor="middle">引用游戏的 Assembly-CSharp.dll</text>
  <rect x="762" y="188" width="376" height="150" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="778" y="212" font-size="13" fill="#6b7280" font-family="Consolas, monospace">namespace HKCustomSceneMod.Patchers</text>
  <text x="778" y="236" font-size="13" fill="#1f2937" font-family="Consolas, monospace">class PatchAreaTitleController</text>
  <text x="778" y="260" font-size="13" fill="#1f2937" font-family="Consolas, monospace">{</text>
  <text x="798" y="282" font-size="13" fill="#374151" font-family="Consolas, monospace">public float  Pause = 3f;</text>
  <text x="798" y="304" font-size="13" fill="#374151" font-family="Consolas, monospace">public string AreaEvent = "";</text>
  <text x="798" y="326" font-size="13" fill="#16a34a" font-family="Consolas, monospace">void Awake() { 真正干活 }</text>
  <text x="778" y="348" font-size="13" fill="#1f2937" font-family="Consolas, monospace">}</text>
  <text x="950" y="368" font-size="14" font-weight="bold" fill="#9a3412" text-anchor="middle">编译成同名 HKCustomSceneMod.dll</text>
  <text x="950" y="396" font-size="14" fill="#374151" text-anchor="middle">丢进游戏的 Managed/Mods/</text>
  <text x="950" y="422" font-size="13" fill="#6b7280" text-anchor="middle">作用：真正执行逻辑</text>

  <!-- middle -->
  <path d="M460 275 L740 275" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="600" y="262" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">名字必须完全一致</text>
  <text x="600" y="300" font-size="12" fill="#6b7280" text-anchor="middle">程序集名 / 命名空间 / 类名 / 字段名</text>

  <!-- what unity writes -->
  <rect x="300" y="470" width="600" height="150" rx="10" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
  <text x="600" y="500" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">Unity 写进 .unity 文件里的东西</text>
  <rect x="325" y="516" width="550" height="88" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="345" y="542" font-size="13" fill="#374151" font-family="Consolas, monospace">m_Script: {fileID: 11500000, guid: 9f3a1c...</text>
  <text x="345" y="566" font-size="13" fill="#374151" font-family="Consolas, monospace">           assembly: HKCustomSceneMod</text>
  <text x="345" y="590" font-size="13" fill="#374151" font-family="Consolas, monospace">           namespace+class: ...Patchers.PatchAreaTitleController</text>

  <!-- runtime lookup -->
  <rect x="200" y="650" width="800" height="140" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="600" y="680" font-size="16" font-weight="bold" fill="#166534" text-anchor="middle">游戏运行时</text>
  <text x="600" y="712" font-size="15" fill="#374151" text-anchor="middle">读到"程序集 HKCustomSceneMod + 类 ...PatchAreaTitleController + Pause=3"</text>
  <text x="600" y="740" font-size="15" fill="#374151" text-anchor="middle">→ 在真正加载的那个 dll 里按这个三元组找到类 → 挂上去</text>
  <text x="600" y="770" font-size="15" font-weight="bold" fill="#166534" text-anchor="middle">于是跑的是"真身"逻辑，用的是你在 Unity 里填的字段值</text>

  <!-- failure -->
  <rect x="40" y="650" width="140" height="140" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="110" y="700" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">不满足时</text>
  <text x="110" y="728" font-size="13" fill="#991b1b" text-anchor="middle">Missing</text>
  <text x="110" y="748" font-size="13" fill="#991b1b" text-anchor="middle">(Mono</text>
  <text x="110" y="768" font-size="13" fill="#991b1b" text-anchor="middle">Script)</text>

  <defs>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
