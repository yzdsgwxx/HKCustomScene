<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="42" font-size="26" font-weight="bold" fill="#111827" text-anchor="middle">图 6 · 多房间：整张地图与"加一间房要改哪两处"</text>
  <text x="600" y="70" font-size="15" fill="#6b7280" text-anchor="middle">虚线 = 运行时由代码按表连起来（不用在 Unity 里手工互相引用）</text>

  <!-- vanilla -->
  <rect x="60" y="120" width="230" height="120" rx="10" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
  <text x="175" y="152" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">德特茅斯 Town</text>
  <text x="175" y="180" font-size="13" fill="#374151" text-anchor="middle">原版场景</text>
  <rect x="95" y="194" width="160" height="34" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="175" y="216" font-size="13" fill="#374151" text-anchor="middle">bot1（水井的门）</text>

  <!-- arrow into room1 -->
  <path d="M290 190 L400 190" stroke="#6b7280" stroke-width="3" marker-end="url(#a6)"/>
  <text x="345" y="176" font-size="12" fill="#374151" text-anchor="middle">改指向</text>

  <!-- Room1 -->
  <rect x="400" y="120" width="240" height="140" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="520" y="152" font-size="16" font-weight="bold" fill="#166534" text-anchor="middle">HKCS_Room01</text>
  <text x="520" y="178" font-size="13" fill="#374151" text-anchor="middle">64 × 32　主区域名</text>
  <rect x="420" y="196" width="90" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="465" y="224" font-size="13" fill="#1e40af" text-anchor="middle">left1</text>
  <rect x="530" y="196" width="90" height="44" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="575" y="224" font-size="13" fill="#854d0e" text-anchor="middle">right1</text>

  <!-- dashed to room2 -->
  <path d="M640 218 L740 218" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a6d)"/>
  <text x="690" y="204" font-size="12" fill="#9a3412" text-anchor="middle">BuildRoomLinks</text>

  <!-- Room2 -->
  <rect x="740" y="120" width="240" height="140" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="860" y="152" font-size="16" font-weight="bold" fill="#166534" text-anchor="middle">HKCS_Room02</text>
  <text x="860" y="178" font-size="13" fill="#374151" text-anchor="middle">48 × 48　小标题</text>
  <rect x="760" y="196" width="90" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="805" y="224" font-size="13" fill="#1e40af" text-anchor="middle">left1</text>
  <rect x="870" y="196" width="90" height="44" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="915" y="224" font-size="13" fill="#854d0e" text-anchor="middle">right1</text>

  <!-- dashed to room3 -->
  <path d="M980 218 L1030 218" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a6d)"/>

  <!-- Room3 -->
  <rect x="1030" y="120" width="120" height="140" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1090" y="170" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">Room03</text>
  <text x="1090" y="196" font-size="12" fill="#374151" text-anchor="middle">32 × 96</text>

  <!-- two places to edit -->
  <rect x="60" y="320" width="510" height="250" rx="12" fill="#eef3fb" stroke="#4a6fa5" stroke-width="2.5"/>
  <text x="315" y="352" font-size="17" font-weight="bold" fill="#1e40af" text-anchor="middle">① C# 里：Consts/RoomNames.cs</text>
  <rect x="85" y="370" width="460" height="180" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="103" y="396" font-size="13" fill="#6b7280" font-family="Consolas, monospace">public static readonly List&lt;RoomDef&gt; All =</text>
  <text x="103" y="420" font-size="13" fill="#374151" font-family="Consolas, monospace">  new RoomDef(Room01, 64f, 32f, "left1", "right1", true),</text>
  <text x="103" y="444" font-size="13" fill="#374151" font-family="Consolas, monospace">  new RoomDef(Room02, 48f, 48f, "left1", "right1", false),</text>
  <text x="103" y="468" font-size="13" fill="#374151" font-family="Consolas, monospace">  new RoomDef(Room03, 32f, 96f, "left1", "right1", false),</text>
  <text x="103" y="500" font-size="13" fill="#16a34a" font-family="Consolas, monospace">  // 加一间房 = 加一行</text>
  <text x="103" y="528" font-size="12" fill="#6b7280">场景名 / 宽 / 高 / 进来落在哪 / 通往下一间的门 / 要不要弹区域名</text>

  <rect x="630" y="320" width="510" height="250" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="885" y="352" font-size="17" font-weight="bold" fill="#166534" text-anchor="middle">② Unity 里：一个同名场景</text>
  <text x="885" y="384" font-size="14" fill="#374151" text-anchor="middle">复制上一间房的场景 → 改名 → 改地形</text>
  <text x="885" y="412" font-size="14" fill="#374151" text-anchor="middle">摆 left1 落点、right1 门</text>
  <text x="885" y="440" font-size="14" fill="#374151" text-anchor="middle">__Initializer 三个组件（只有第一间房弹主区域名）</text>
  <text x="885" y="468" font-size="14" fill="#374151" text-anchor="middle">Inspector 底部 AssetBundle 填同一个包名</text>
  <text x="885" y="500" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">→ 重新打包 AssetBundle</text>
  <text x="885" y="528" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">→ 重新编译 FinalMod</text>

  <!-- bottom -->
  <rect x="60" y="600" width="1080" height="130" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="630" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">多房间比单房间多出来的麻烦（官方教程完全没提）</text>
  <text x="600" y="660" font-size="14" fill="#374151" text-anchor="middle">① 每间房都要单独设尺寸 → 一个 if 变一张表（骨架已按表分派）</text>
  <text x="600" y="686" font-size="14" fill="#374151" text-anchor="middle">② 游戏内地图会重叠 → 每间房都 SetManualTilemap(0,0,w,h)，骨架里标了 TODO</text>
  <text x="600" y="712" font-size="14" fill="#374151" text-anchor="middle">③ 区域名只弹一次 → 整个区域共用一个 VisitedBool，只有第一间房 SubArea = false</text>

  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="a6d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>
</svg>
