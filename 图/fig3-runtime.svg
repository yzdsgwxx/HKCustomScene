<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" font-family="Microsoft YaHei, Segoe UI, PingFang SC, sans-serif">
  <rect width="1200" height="1000" fill="#ffffff"/>
  <text x="600" y="42" font-size="26" font-weight="bold" fill="#111827" text-anchor="middle">图 3 · 运行时到底发生了什么</text>
  <text x="600" y="70" font-size="15" fill="#6b7280" text-anchor="middle">左边是游戏/Unity 的动作　右边是对应的代码在哪</text>

  <!-- timeline -->
  <line x1="70" y1="110" x2="70" y2="960" stroke="#d1d5db" stroke-width="3"/>

  <!-- step 1 -->
  <circle cx="70" cy="140" r="16" fill="#4a6fa5"/>
  <text x="70" y="146" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="110" y="116" width="620" height="48" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="130" y="146" font-size="15" fill="#1f2937">游戏启动，扫描 Mods 文件夹，加载 HKCustomSceneMod.dll</text>
  <text x="760" y="146" font-size="13" fill="#6b7280">—</text>

  <!-- step 2 -->
  <circle cx="70" cy="220" r="16" fill="#4a6fa5"/>
  <text x="70" y="226" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="110" y="196" width="620" height="48" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="130" y="226" font-size="15" fill="#1f2937">new CustomSceneMod()　构造函数跑起来（此时还没有场景）</text>
  <text x="760" y="226" font-size="13" fill="#b45309">CustomSceneMod.cs 构造函数</text>

  <!-- step 3 -->
  <circle cx="70" cy="300" r="16" fill="#4a6fa5"/>
  <text x="70" y="306" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="110" y="276" width="620" height="48" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="130" y="306" font-size="15" fill="#1f2937">游戏按 GetPreloadNames() 把原版物体准备好（最慢的一步）</text>
  <text x="760" y="306" font-size="13" fill="#b45309">GetPreloadNames()</text>

  <!-- step 4 -->
  <circle cx="70" cy="400" r="16" fill="#16a34a"/>
  <text x="70" y="406" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="110" y="356" width="620" height="88" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="384" font-size="15" fill="#1f2937">Initialize(preloadedObjects)　←　第一次能碰到预载物</text>
  <text x="130" y="410" font-size="14" fill="#166534">· 实例化预载物：DontDestroyOnLoad + SetActive(false)</text>
  <text x="130" y="432" font-size="14" fill="#166534">· 读内嵌资源包，并"一直握着引用"（松手包会被卸载）</text>
  <text x="760" y="384" font-size="13" fill="#b45309">Initialize()</text>
  <text x="760" y="408" font-size="13" fill="#b45309">SceneChanger.Init()</text>

  <!-- step 5 -->
  <circle cx="70" cy="500" r="16" fill="#16a34a"/>
  <text x="70" y="506" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="110" y="476" width="620" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="506" font-size="15" fill="#1f2937">自检：登记的每个房间，资源包里都有对应场景吗？</text>
  <text x="760" y="506" font-size="13" fill="#b45309">ValidateRooms()</text>

  <!-- step 6 -->
  <circle cx="70" cy="590" r="16" fill="#d97706"/>
  <text x="70" y="596" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="110" y="556" width="620" height="68" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="130" y="584" font-size="15" fill="#1f2937">玩家碰到德特茅斯水井的门 → 场景切换</text>
  <text x="130" y="610" font-size="14" fill="#9a3412">activeSceneChanged(from, to) 被触发（每次切场景都会）</text>
  <text x="760" y="584" font-size="13" fill="#b45309">OnSceneChanged()</text>

  <!-- step 7 -->
  <circle cx="70" cy="700" r="16" fill="#d97706"/>
  <text x="70" y="706" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <rect x="110" y="646" width="620" height="108" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="130" y="674" font-size="15" fill="#1f2937">分派：to 是原版场景 还是 我们自己的房间？</text>
  <text x="130" y="700" font-size="14" fill="#9a3412">· 原版场景 → 把它的门改指向我们的第一间房</text>
  <text x="130" y="722" font-size="14" fill="#9a3412">· 我们的房间 → GameManager.RefreshTilemapInfo(房间名)</text>
  <text x="130" y="744" font-size="14" font-weight="bold" fill="#991b1b">　这一步不做，房间边界/相机/地图全是错的</text>
  <text x="760" y="700" font-size="13" fill="#b45309">RedirectVanillaGate()</text>
  <text x="760" y="724" font-size="13" fill="#b45309">OnRefreshTilemapInfo()</text>

  <!-- step 8 -->
  <circle cx="70" cy="810" r="16" fill="#dc2626"/>
  <text x="70" y="816" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
  <rect x="110" y="766" width="620" height="88" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="130" y="794" font-size="15" fill="#1f2937">新房间的物体开始跑 Awake / Start</text>
  <text x="130" y="820" font-size="14" fill="#991b1b">· __Initializer 上的 PatchAreaTitleController → 弹区域名</text>
  <text x="130" y="842" font-size="14" fill="#991b1b">· PatchPlayMakerManager → 补上 FSM 基础设施</text>
  <text x="760" y="794" font-size="13" fill="#b45309">Patchers/*.cs</text>

  <!-- step 9 -->
  <circle cx="70" cy="910" r="16" fill="#111827"/>
  <text x="70" y="916" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>
  <rect x="110" y="880" width="620" height="60" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
  <text x="130" y="906" font-size="15" fill="#111827">玩家走到下一道门 → 回到第 6 步</text>
  <text x="130" y="928" font-size="14" fill="#6b7280">多房间就是这一步反复发生</text>

  <!-- side note -->
  <rect x="850" y="110" width="310" height="180" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="1005" y="140" font-size="15" font-weight="bold" fill="#854d0e" text-anchor="middle">读代码的建议顺序</text>
  <text x="1005" y="172" font-size="14" fill="#374151" text-anchor="middle">1. CustomSceneMod.cs</text>
  <text x="1005" y="194" font-size="13" fill="#6b7280" text-anchor="middle">看第 2、3、4、6 步</text>
  <text x="1005" y="222" font-size="14" fill="#374151" text-anchor="middle">2. SceneChanger.cs</text>
  <text x="1005" y="244" font-size="13" fill="#6b7280" text-anchor="middle">看第 4、7 步</text>
  <text x="1005" y="272" font-size="14" fill="#374151" text-anchor="middle">3. Patchers/*.cs</text>

  <rect x="850" y="320" width="310" height="200" rx="10" fill="#eef3fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="1005" y="350" font-size="15" font-weight="bold" fill="#1e40af" text-anchor="middle">排查手段</text>
  <text x="1005" y="382" font-size="14" fill="#374151" text-anchor="middle">F1 → ModLog 看日志</text>
  <text x="1005" y="410" font-size="14" fill="#374151" text-anchor="middle">FSM Viewer → 看状态机</text>
  <text x="1005" y="438" font-size="14" fill="#374151" text-anchor="middle">ILSpy → 查原版类真名</text>
  <text x="1005" y="474" font-size="13" fill="#6b7280" text-anchor="middle">这三个是全部家当</text>
  <text x="1005" y="498" font-size="13" fill="#6b7280" text-anchor="middle">遇到问题先看日志</text>
</svg>
